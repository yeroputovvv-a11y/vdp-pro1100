name: Vendor browser dependencies

on:
  push:
    branches: [main]
    paths:
      - package.json
      - scripts/vendor-dependencies.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build vendor directory
        run: node scripts/vendor-dependencies.mjs

      - name: Commit vendor assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor package-lock.json
          git diff --cached --quiet || git commit -m "Vendor browser dependencies"
          git push
